<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Тараз — Тұғырлы тарих, интерактивті карта</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: #e0f2fe;
      color: #0f172a;
      overflow: hidden;
    }

    header {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.25);
      z-index: 1000;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    header p {
      font-size: 0.8rem;
      opacity: 0.9;
    }

    #app-container {
      display: flex;
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #map {
      flex: 1;
      height: 100%;
      background: #e0f2fe;
    }

    /* Боковое меню с исправленным скроллом */
    #sidebar {
      width: 400px;
      background: #ffffff;
      box-shadow: -5px 0 25px rgba(3, 105, 161, 0.15);
      display: flex;
      flex-direction: column;
      z-index: 999;
      border-left: 3px solid #7dd3fc;
      height: 100%;
      overflow: hidden;
    }

    .sidebar-header {
      position: relative;
      height: 190px;
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
    }

    .sidebar-header-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(2, 132, 199, 0.9), transparent);
      display: flex;
      align-items: flex-end;
      padding: 15px;
    }

    .sidebar-header h2 {
      color: #ffffff;
      font-size: 1.25rem;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255,255,255,0.85);
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      cursor: pointer;
      font-weight: bold;
      color: #0369a1;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      z-index: 10;
    }

    /* Прокручиваемая часть меню */
    .sidebar-content {
      padding: 18px;
      overflow-y: auto;
      flex: 1;
    }

    .place-desc {
      font-size: 0.88rem;
      color: #334155;
      line-height: 1.5;
      margin-bottom: 20px;
      background: #f0f9ff;
      padding: 12px;
      border-radius: 8px;
      border-left: 4px solid #0284c7;
    }

    .categories-title {
      font-size: 0.82rem;
      font-weight: 700;
      color: #0284c7;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .category-buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .cat-btn {
      padding: 10px 5px;
      border: 1px solid #bae6fd;
      background: #f0f9ff;
      color: #0369a1;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.82rem;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .cat-btn:hover, .cat-btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #0284c7;
      box-shadow: 0 4px 10px rgba(2, 132, 199, 0.3);
    }

    .poi-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 20px;
    }

    .poi-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .poi-card:hover {
      border-color: #38bdf8;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.15);
    }

    .poi-title {
      font-weight: 700;
      font-size: 0.9rem;
      color: #0f172a;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .poi-rating {
      background: #fef08a;
      color: #854d0e;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .poi-info {
      font-size: 0.78rem;
      color: #64748b;
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .poi-routes {
      display: flex;
      gap: 10px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed #e2e8f0;
      font-size: 0.75rem;
      color: #0284c7;
      font-weight: 600;
    }

    .center-label {
      background: #0284c7;
      color: white;
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 20px;
      border: 2px solid white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      white-space: nowrap;
    }

    @media (max-width: 768px) {
      #app-container {
        flex-direction: column-reverse;
      }
      #sidebar {
        width: 100%;
        height: 50%;
      }
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>☁️ Тараз — Көрікті жерлердің интерактивті картасы</h1>
      <p>«Зерде» ғылыми жобасы аясында дайындалған интерактивті жүйе</p>
    </div>
  </header>

  <div id="app-container">
    <div id="map"></div>

    <div id="sidebar" style="display: none;">
      <div class="sidebar-header" id="sidebar-img">
        <button class="close-btn" onclick="closeSidebar()">✕</button>
        <div class="sidebar-header-overlay">
          <h2 id="sidebar-title">Атауы</h2>
        </div>
      </div>
      <div class="sidebar-content">
        <div class="place-desc" id="sidebar-desc">Сипаттамасы...</div>

        <div class="categories-title">Жақын маңдағы инфрақұрылым:</div>
        <div class="category-buttons">
          <button class="cat-btn active" onclick="filterPoi('food')"><span>🍽️</span> Тамақтану</button>
          <button class="cat-btn" onclick="filterPoi('hotel')"><span>🏨</span> Қонақүйлер</button>
          <button class="cat-btn" onclick="filterPoi('park')"><span>🌳</span> Саябақтар</button>
          <button class="cat-btn" onclick="filterPoi('pharmacy')"><span>🏥</span> Дәріханалар</button>
        </div>

        <div class="poi-list" id="poi-list">
          <!-- Заведения подгружаются сюда -->
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        lat: 42.8335,
        lng: 71.2052,
        img: "https://upload.wikimedia.org/wikipedia/commons/4/4c/Aisha_Bibi_Mausoleum.jpg",
        desc: "XI-XII ғасырлардағы оймыш терракоталық плиталармен қапталған сәулет өнерінің озық үлгісі. Мәңгілік махаббат символы.",
        pois: {
          food: [
            { name: "Кафе 'Айша'", rating: "⭐ 4.8", addr: "Айша-Биби ауылы, Жібек Жолы 12", work: "09:00 - 22:00", phone: "+7 (777) 111-22-33", car: "2 мин", bike: "5 мин", walk: "12 мин", lat: 42.8350, lng: 71.2070 }
          ],
          hotel: [

          ],
          park: [

          ],
          hotel: [
            { name: "Визит-орталық қонақ бөлмесі", rating: "⭐ 4.9", addr: "Ақыртас кешені", work: "24/7", phone: "+7 (7262) 50-50-50", car: "1 мин", bike: "2 мин", walk: "4 мин", lat: 42.9565, lng: 71.8015 }
          ],

          ],
          pharmacy: [
            { name: "Алғашқы көмек пункті", rating: "⭐ 4.7", addr: "Визит-орталық", work: "09:00 - 18:00", phone: "+7 (702) 000-11-22", car: "1 мин", bike: "1 мин", walk: "2 мин", lat: 42.9561, lng: 71.8012 }
          ]
        }
      }
    ];

    const map = L.map('map').setView(tarazCenter, 11);

    L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
      maxZoom: 20,
      attribution: '© OpenStreetMap France'
    }).addTo(map);

    const centerIcon = L.divIcon({
      className: 'center-label',
      html: '🏛️ ТАРАЗ ҚАЛАСЫ',
      iconSize: [120, 30],
      iconAnchor: [60, 15]
    });
    L.marker(tarazCenter, { icon: centerIcon }).addTo(map);

    let activeMonument = null;
    let poiMarkers = [];
    let poiLines = [];

    monuments.forEach(m => {
      L.polyline([tarazCenter, [m.lat, m.lng]], {
        color: '#0284c7',
        weight: 2,
        dashArray: '6, 8',
        opacity: 0.6
      }).addTo(map);

      const marker = L.marker([m.lat, m.lng]).addTo(map);
      marker.bindTooltip(`<b>${m.title}</b>`, { permanent: false, direction: 'top' });

      marker.on('click', () => {
        openMonumentDetails(m);
      });
    });

    function openMonumentDetails(monument) {
      activeMonument = monument;
      map.flyTo([monument.lat, monument.lng], 14, { duration: 1.5 });

      const sidebar = document.getElementById('sidebar');
      sidebar.style.display = 'flex';

      document.getElementById('sidebar-title').innerText = monument.title;
      document.getElementById('sidebar-desc').innerText = monument.desc;
      document.getElementById('sidebar-img').style.backgroundImage = `url('${monument.img}')`;

      filterPoi('food');
    }

    function filterPoi(category) {
      if (!activeMonument) return;

      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
      if (event && event.currentTarget) {
        event.currentTarget.classList.add('active');
      }

      poiMarkers.forEach(m => map.removeLayer(m));
      poiLines.forEach(l => map.removeLayer(l));
      poiMarkers = [];
      poiLines = [];

      const listContainer = document.getElementById('poi-list');
      listContainer.innerHTML = '';

      const items = activeMonument.pois[category] || [];

      items.forEach(poi => {
        const iconEmoji = category === 'food' ? '🍽️' : category === 'hotel' ? '🏨' : category === 'park' ? '🌳' : '🏥';
        
        const poiMarker = L.marker([poi.lat, poi.lng]).addTo(map);
        poiMarker.bindPopup(`<b>${iconEmoji} ${poi.name}</b><br>${poi.addr}`);
        poiMarkers.push(poiMarker);

        // Линии от мавзолея до заведений изменены на ярко-желтый цвет (#eab308)
        const line = L.polyline([[activeMonument.lat, activeMonument.lng], [poi.lat, poi.lng]], {
          color: '#eab308',
          weight: 4,
          opacity: 0.9
        }).addTo(map);
        poiLines.push(line);

        const card = document.createElement('div');
        card.className = 'poi-card';
        card.innerHTML = `
          <div class="poi-title">
            <span>${iconEmoji} ${poi.name}</span>
            <span class="poi-rating">${poi.rating}</span>
          </div>
          <div class="poi-info">
            <span>📍 ${poi.addr}</span>
            <span>🕒 ${poi.work}</span>
            <span>📞 ${poi.phone}</span>
          </div>
          <div class="poi-routes">
            <span>🚗 ${poi.car}</span>
            <span>🚲 ${poi.bike}</span>
            <span>🚶 ${poi.walk}</span>
          </div>
        `;

        card.onclick = () => {
          map.flyTo([poi.lat, poi.lng], 16, { duration: 1 });
          poiMarker.openPopup();
        };

        listContainer.appendChild(card);
      });
    }

    function closeSidebar() {
      document.getElementById('sidebar').style.display = 'none';
      map.flyTo(tarazCenter, 11, { duration: 1.5 });
      poiMarkers.forEach(m => map.removeLayer(m));
      poiLines.forEach(l => map.removeLayer(l));
    }
  </script>
</body>
</html>
